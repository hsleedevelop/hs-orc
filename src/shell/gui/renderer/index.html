<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 렌더러는 로컬 번들만 실행한다. 원격 코드·인라인 스크립트를 허용하지 않는다. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
    <title>hs-orchestrator</title>
    <style>
      /* Tokyo Night. 색은 **전부** 여기 변수로만 둔다 — 화면 코드에 하드코딩된 색이 생기면 테마가 갈라진다. */
      :root {
        color-scheme: dark;
        --bg: #1a1b26;
        --bg-elev: #1f2335;
        --panel: #24283b;
        --panel-2: #292e42;
        --border: #2f3549;
        --border-2: #3b4261;
        --fg: #c0caf5;
        --fg-strong: #e4e9f7;
        --dim: #565f89;
        --dim-2: #7982a9;
        --blue: #7aa2f7;
        --cyan: #7dcfff;
        --purple: #bb9af7;
        --green: #9ece6a;
        --teal: #73daca;
        --orange: #ff9e64;
        --red: #f7768e;
        --yellow: #e0af68;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --radius: 10px;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.6 var(--ui);
        -webkit-font-smoothing: antialiased;
      }
      #root { height: 100%; }
      .shell { display: flex; flex-direction: column; height: 100%; }

      /* ── 타이틀바 ─────────────────────────────────────────── */
      .titlebar {
        -webkit-app-region: drag;
        display: flex; align-items: center; gap: 10px;
        height: 38px; flex: 0 0 38px;
        padding: 0 14px 0 84px;   /* 84px = macOS 신호등 자리 */
        background: var(--bg-elev);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }
      .titlebar .name { font-weight: 600; color: var(--fg-strong); letter-spacing: .2px; }
      .titlebar .meta { color: var(--dim); font-family: var(--mono); font-size: 11px; }

      /* ── 프로젝트 바 ──────────────────────────────────────── */
      .projectbar {
        display: flex; flex-direction: column; gap: 8px;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .pb-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .pb-row .lead { font-size: 11px; color: var(--dim); letter-spacing: .3px; text-transform: uppercase; flex: 0 0 auto; }
      .project-id { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
      .project-name { font-weight: 600; color: var(--fg-strong); font-size: 13px; white-space: nowrap; }
      /* CSS 로 앞을 자르지 않는다 — `direction: rtl` 은 `~/…` 의 `~` 를 끝으로 밀어 **틀린 경로**를 찍는다. */
      .project-path { font-family: var(--mono); font-size: 11px; color: var(--dim-2); white-space: nowrap; }
      .spacer { flex: 1 1 auto; }

      .chip {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 1px 7px; border-radius: 999px;
        font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .3px;
        border: 1px solid var(--border-2); color: var(--dim-2); background: var(--bg-elev);
        white-space: nowrap;
      }
      .chip.git { color: var(--teal); border-color: color-mix(in srgb, var(--teal) 35%, transparent); }
      .chip.nogit { color: var(--orange); border-color: color-mix(in srgb, var(--orange) 35%, transparent); }
      .chip.pass { color: var(--green); border-color: color-mix(in srgb, var(--green) 45%, transparent); background: color-mix(in srgb, var(--green) 12%, transparent); }
      .chip.fail { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); background: color-mix(in srgb, var(--red) 12%, transparent); }
      .chip.unknown { color: var(--yellow); border-color: color-mix(in srgb, var(--yellow) 40%, transparent); }
      .chip.wt { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 40%, transparent); background: color-mix(in srgb, var(--blue) 12%, transparent); }
      .chip.grade { color: var(--purple); border-color: color-mix(in srgb, var(--purple) 40%, transparent); background: color-mix(in srgb, var(--purple) 12%, transparent); }

      select, .btn {
        font: inherit; font-size: 12px; white-space: nowrap;
        background: var(--bg-elev); color: var(--fg);
        border: 1px solid var(--border-2); border-radius: 7px;
        padding: 5px 10px; cursor: pointer;
      }
      select { max-width: 260px; font-family: var(--mono); font-size: 11px; }
      .btn:hover, select:hover { border-color: var(--blue); color: var(--fg-strong); }
      .btn:active { transform: translateY(1px); }
      .btn.accent { background: var(--blue); border-color: var(--blue); color: #16161e; font-weight: 700; }
      .btn.accent:hover { background: var(--cyan); border-color: var(--cyan); color: #16161e; }
      .btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
      .btn[disabled] { opacity: .35; cursor: default; transform: none; }
      .btn.wide { width: 100%; padding: 10px; font-size: 13px; }

      /* ── 탭 ───────────────────────────────────────────────── */
      nav.tabs { display: flex; gap: 2px; padding: 0 12px; background: var(--bg-elev); border-bottom: 1px solid var(--border); }
      nav.tabs button {
        background: none; border: none; border-bottom: 2px solid transparent;
        color: var(--dim-2); font: inherit; font-size: 12px; font-weight: 500;
        padding: 9px 12px; cursor: pointer;
      }
      nav.tabs button:hover { color: var(--fg); }
      nav.tabs button[aria-current='true'] { color: var(--blue); border-bottom-color: var(--blue); }

      /* ── 본문 ─────────────────────────────────────────────── */
      main { flex: 1 1 auto; overflow-y: auto; padding: 18px 16px 48px; }
      .stack { display: flex; flex-direction: column; gap: 14px; max-width: 900px; margin: 0 auto; }

      .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
      .card > .label { display: block; margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--dim); }
      .card.accented { border-color: color-mix(in srgb, var(--blue) 40%, var(--border)); }

      textarea, input[type='text'] {
        width: 100%; background: var(--bg); color: var(--fg-strong);
        border: 1px solid var(--border-2); border-radius: 8px;
        font: inherit; font-size: 13px; padding: 9px 11px; resize: vertical;
      }
      textarea.code, input.code { font-family: var(--mono); font-size: 12px; }
      textarea:focus, input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 15%, transparent); }
      textarea::placeholder, input::placeholder { color: var(--dim); }

      .row { display: flex; align-items: center; gap: 10px; }
      .row.end { justify-content: flex-end; }
      .hint { color: var(--dim); font-size: 11px; }
      .kbd { font-family: var(--mono); font-size: 10px; border: 1px solid var(--border-2); border-radius: 4px; padding: 0 4px; color: var(--dim-2); }

      /* 쓰기 권한은 체크박스가 아니라 **스위치**다 — 두 승인 게이트 중 하나라 눈에 띄어야 한다. */
      .toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
      .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
      .track { flex: 0 0 34px; width: 34px; height: 20px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border-2); position: relative; transition: background .12s, border-color .12s; }
      .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--dim-2); transition: transform .12s, background .12s; }
      .toggle input:checked + .track { background: color-mix(in srgb, var(--orange) 25%, transparent); border-color: var(--orange); }
      .toggle input:checked + .track::after { transform: translateX(14px); background: var(--orange); }
      .toggle .text { font-size: 12px; }
      .toggle .text b { color: var(--orange); font-weight: 600; }

      /* ── 배정 / 비용 ──────────────────────────────────────── */
      .planline { display: flex; gap: 10px; font-family: var(--mono); font-size: 12px; padding: 2px 0; }
      .planline .k { flex: 0 0 62px; color: var(--dim); }
      .planline .v { color: var(--fg); min-width: 0; word-break: break-word; }
      .planline.primary .v { color: var(--purple); }
      .planline.reviewer .v { color: var(--cyan); }
      .planline.write-on .v { color: var(--orange); }

      .cost-figure { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--yellow); letter-spacing: -.2px; }

      .dim { color: var(--dim); }
      .warn { color: var(--orange); }
      .bad { color: var(--red); }
      .good { color: var(--green); }
      .mono { font-family: var(--mono); font-size: 12px; }

      pre {
        white-space: pre-wrap; word-break: break-word; margin: 0;
        font-family: var(--mono); font-size: 12px; line-height: 1.55; color: var(--fg);
        background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 11px;
        max-height: 340px; overflow: auto;
      }
      pre.plain { background: none; border: none; padding: 0; color: var(--dim-2); }

      table { border-collapse: collapse; width: 100%; font-size: 12px; }
      td { padding: 5px 12px 5px 0; vertical-align: top; border-bottom: 1px solid var(--border); }
      tr:last-child td { border-bottom: none; }
      td.mono { font-family: var(--mono); font-size: 11px; }

      .banner { border-radius: 8px; padding: 9px 11px; font-size: 12px; border: 1px solid; }
      .banner.error { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); background: color-mix(in srgb, var(--red) 10%, transparent); }
      .banner.note { color: var(--dim-2); border-color: var(--border-2); background: var(--bg-elev); }

      /* 공용 input 규칙(width:100%)보다 **뒤에** 둔다 — 프로젝트 바에서는 늘어나면 안 된다. */
      .pb-row .wt-name { flex: 0 0 210px; width: 210px; padding: 5px 9px; font-size: 12px; }
      .pb-row select { flex: 0 0 auto; }

      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 6px; border: 2px solid var(--bg); }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
