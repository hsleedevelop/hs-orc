<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 렌더러는 로컬 번들만 실행한다. 원격 코드·인라인 스크립트를 허용하지 않는다. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
    <title>hs-orchestrator</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #10131a; color: #e6e9ef; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
      main { padding: 20px; }
      nav { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid #232838; }
      nav button { background: none; border: 1px solid #232838; color: #9aa4bf; padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
      nav button[aria-current='true'] { color: #e6e9ef; border-color: #4c8dff; }
      h1 { font-size: 13px; font-weight: 600; margin: 0 0 12px; color: #9aa4bf; }
      pre { white-space: pre-wrap; margin: 0; }
      .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; background: #e6e9ef; color: #10131a; font-weight: 700; font-size: 11px; }
      .dim { color: #6c7691; }
      .warn { color: #ff8f6b; }
      .cost { margin: 12px 0; padding: 10px 12px; border: 1px solid #232838; border-radius: 8px; }
      input, textarea { width: 100%; box-sizing: border-box; background: #161a24; border: 1px solid #232838; color: inherit; font: inherit; padding: 6px 8px; border-radius: 6px; }
      button.primary { background: #4c8dff; border: none; color: #08101f; font-weight: 700; padding: 6px 14px; border-radius: 6px; cursor: pointer; font: inherit; margin-top: 10px; }
      button.primary[disabled] { opacity: .4; cursor: default; }
      table { border-collapse: collapse; width: 100%; }
      td { padding: 2px 10px 2px 0; vertical-align: top; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
